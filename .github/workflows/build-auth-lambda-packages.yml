  summary:
    name: Build Summary
    needs: [build-whatsapp-auth, build-payment-webhook, build-notification-retry, build-payment-session]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "### Auth Lambda Packages Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| WhatsApp Auth Handler | ${{ needs.build-whatsapp-auth.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Payment Webhook Handler | ${{ needs.build-payment-webhook.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Notification Retry Handler | ${{ needs.build-notification-retry.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Payment Session Handler | ${{ needs.build-payment-session.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**S3 Paths:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://sipap-lambda-packages-dev/auth-handlers/python_${{ env.PYTHON_VERSION }}/whatsapp_auth_handler.zip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://sipap-lambda-packages-dev/auth-handlers/python_${{ env.PYTHON_VERSION }}/payment_webhook_handler.zip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://sipap-lambda-packages-dev/auth-handlers/python_${{ env.PYTHON_VERSION }}/notification_retry_handler.zip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://sipap-lambda-packages-dev/auth-handlers/python_${{ env.PYTHON_VERSION }}/payment_session_handler.zip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Git SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHON_VERSION: '3.13'
